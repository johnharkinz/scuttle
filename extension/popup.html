<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scuttle</title>
    <link rel="stylesheet" href="extension.css" />
  </head>
  <body class="popup">
    <header class="topbar">
      <!-- The Scuttle mark (camas-design DEC-005) at 22px. Its teal is only ever used here. -->
      <svg class="mark" aria-hidden="true" width="22" height="22" viewBox="0 0 16 16"><rect width="16" height="16" fill="#016a75" /><rect x="6" y="3" width="4" height="2" fill="#f8f6f0" /><rect x="3.636" y="6.636" width="2.727" height="5.727" fill="none" stroke="#f8f6f0" stroke-width="1.273" /><rect x="9" y="6" width="4" height="7" fill="#f8f6f0" /><rect x="13" y="0" width="3" height="3" fill="#d9481f" /></svg>
      <h1>Scuttle</h1>
    </header>
    <main class="panel">
      <p>Compares this page as the server sends it with the page in your tab.</p>
      <button id="compare" class="primary" type="button">Compare this page</button>
      <div id="message" role="status"></div>
      <p class="promise">Nothing is sent or stored.</p>
    </main>
    <script type="module" src="dist/popup.js"></script>
  </body>
</html>
